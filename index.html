<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제주 날씨 실험실 · 남주중학교</title>
<style>
:root{font-family:system-ui,'맑은 고딕',sans-serif;color:#193d38;background:#f3f6f1}*{box-sizing:border-box}body{margin:0}header{padding:32px 5vw 26px;background:#163e37;color:white}header small{letter-spacing:3px;color:#a9d6c2}h1{font-size:clamp(25px,4vw,40px);margin:10px 0}header p{margin:0;color:#c8ded4;line-height:1.7}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);max-width:1800px;margin:auto}aside{padding:25px 18px}nav{display:grid;gap:12px}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}nav button{background:white;color:inherit;border:1px solid #d3dfd5;border-radius:14px;padding:18px;text-align:left;box-shadow:0 4px 0 #dce5da;transition:transform .1s}nav button:active{transform:translateY(3px);box-shadow:none}nav button[aria-pressed=true]{background:#d9efb1;border-color:#8dad71}nav span{font-size:25px}nav strong{display:block;margin:9px 0;font-size:16px}nav small{color:#607368;line-height:1.6}main{padding:25px 24px;min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h2{font-size:21px;margin:0}.actions{display:flex;gap:8px}.actions a,.actions button{padding:10px 13px;border:1px solid #bdcec1;border-radius:8px;background:white;color:#193d38;text-decoration:none;font-size:13px}.notice{font-size:12px;line-height:1.7;color:#667065;margin:14px 0}iframe{width:100%;height:75vh;min-height:560px;border:1px solid #cedbce;border-radius:14px;background:white}iframe[hidden]{display:none}footer{padding:16px 0;color:#6b786c;font-size:12px}button:focus-visible,a:focus-visible{outline:3px solid #e89438;outline-offset:3px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{padding:18px 16px 0}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}nav button{padding:12px}nav span{font-size:20px}nav strong{font-size:14px}nav small{display:none}main{padding:24px 16px}iframe{min-height:550px;height:75vh}}
</style></head><body>
<header><small>NAMJU · WEATHER LAB</small><h1>제주 날씨 실험실</h1><p>날씨와 여행, 스포츠 그리고 게임.<br>남주중학교 웹 프로젝트 4개를 한곳에서 만나보세요.</p></header>
<div class="layout"><aside><nav id="nav" aria-label="프로젝트 선택"></nav></aside><main><div class="toolbar"><h2 id="title"></h2><div class="actions"><button id="share">공유 주소 복사</button><a id="open" target="_blank" rel="noopener">새 창에서 열기 ↗</a></div></div><p class="notice" id="note"></p><div id="frames"></div><footer id="status" role="status">프로젝트를 선택하면 이 화면에서 바로 열립니다. 외부 서비스 이용에는 인터넷 연결이 필요합니다.</footer></main></div>
<script>
const projects=[{"File":"jeju-map.html","Name":"제주 어디가 맑을까?","Desc":"8개 여행 권역을 누르는 제주 키캡 지도","Icon":"☀","Note":"원본의 날씨 연결 상태에 따라 표시되는 정보가 달라집니다."},{"File":"sports-planner.html","Name":"SPORTS PLANNER","Desc":"남주중학교 날씨와 스포츠 활동 플래너","Icon":"⚽","Note":"공개용 사본에서 내장 기상청 인증키를 제거했습니다. 실시간 조회에는 별도 설정이 필요할 수 있습니다."},{"File":"sports-trip.html","Name":"제주 체육시설 도장깨기","Desc":"제주 스포츠 장소를 탐색하는 스포트립","Icon":"🏀","Note":"공개용 사본에서 내장 지도 키를 제거했습니다. 카카오 지도는 키와 사이트 도메인 등록이 필요합니다."},{"File":"weather-pet.html","Name":"날씨 디지몬 키우기","Desc":"날씨와 함께 즐기는 디지털 펫 프로젝트","Icon":"🎮","Note":"공개용 사본에서 내장 기상청 인증키를 제거했습니다. 실시간 조회에는 별도 설정이 필요할 수 있습니다."}];
const nav=document.getElementById('nav'), frames=document.getElementById('frames');
projects.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML=`<span aria-hidden="true">${p.Icon}</span><strong>${p.Name}</strong><small>${p.Desc}</small>`;b.onclick=()=>select(i);nav.append(b);const f=document.createElement('iframe');f.title=p.Name;f.hidden=true;f.allow='fullscreen';frames.append(f)});
function select(i){const p=projects[i];document.getElementById('title').textContent=p.Name;document.getElementById('note').textContent=p.Note;document.getElementById('open').href=p.File;[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));[...frames.children].forEach((f,j)=>{f.hidden=i!==j;if(i===j&&!f.hasAttribute('src'))f.src=p.File});history.replaceState(null,'','#'+p.File)}
document.getElementById('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent='공유 주소를 복사했습니다.'}catch{document.getElementById('status').textContent='주소창의 주소를 복사해 공유해주세요.'}};
select(Math.max(0,projects.findIndex(p=>p.File===location.hash.slice(1))));
</script></body></html>
